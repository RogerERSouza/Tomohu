name: Validate Tomohu

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**', 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tomohu
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: tomohu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tomohu -d tomohu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Fast regression suite
        run: python -m pytest
      - name: PostgreSQL migration and API suite
        env:
          TOMOHU_TEST_DATABASE_URL: postgresql+psycopg://tomohu:test-only-password@localhost:5432/tomohu_test
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps chromium
        working-directory: .
      - name: Real account browser integration on PostgreSQL
        working-directory: .
        env:
          TOMOHU_E2E_DATABASE_URL: postgresql+psycopg://tomohu:test-only-password@localhost:5432/tomohu_test
        run: |
          python scripts/run_live_e2e.py
          python scripts/run_live_e2e.py --suite privacy

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: account-integration-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
