services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tomohu
      POSTGRES_USER: tomohu
      POSTGRES_PASSWORD: tomohu
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tomohu -d tomohu']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
